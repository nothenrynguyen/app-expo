name: Sync verified jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5-17 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: verified-job-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sync:jobs
      - name: Publish changed snapshot
        run: |
          if git diff --quiet -- public/jobs.json public/internships.json public/fulltime.json data/quarantine.json data/listing-health.json data/company-boards.json; then
            echo "No material job changes."
            exit 0
          fi
          git config user.name "app-expo-bot"
          git config user.email "app-expo-bot@users.noreply.github.com"
          git add public/jobs.json public/internships.json public/fulltime.json data/quarantine.json data/listing-health.json data/company-boards.json
          git commit -m "data: refresh verified jobs"
          git push
