name: Run source maintenance

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run maintain:sources -- --mode=${{ inputs.mode }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish maintenance changes
        run: |
          if git diff --quiet -- data/sources.json data/source-health.json data/source-report.md; then
            echo "No source maintenance changes."
            exit 0
          fi
          git config user.name "app-expo-bot"
          git config user.email "app-expo-bot@users.noreply.github.com"
          git add data/sources.json data/source-health.json data/source-report.md
          git commit -m "data: maintain job sources"
          git push
